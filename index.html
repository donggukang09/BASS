<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BASS LOG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>BASS LOG · 덴데 & 부우의 배스 조행기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{
  --bg:#1a1a2e; --bg2:#16213e; --card:#0f3460; --line:#2a2a4a;
  --accent:#e94560; --gold:#f7b731; --text:#eaeaea; --sub:#a0a0b8;
  --green:#8BC34A; --navH:64px;
  --notch:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:15px;line-height:1.5}
body{min-height:100vh;overflow-x:hidden}
.pf{font-family:'Press Start 2P',monospace;letter-spacing:.5px}
/* 레트로 요소는 도트 폰트 유지, 설명 글씨는 프리텐다드 */
.dot,h1.t,.chip,.tg,.bubble,.badge,.stitle span,#nav button,.photo label,.inline button,.mb,.spin b,.mapNote,.x,.sync{font-family:'Galmuri11','Pretendard Variable',sans-serif}
.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}

/* 별 배경 */
#stars{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
.shooting{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:0;animation:shoot var(--sd) ease-in var(--sdl) infinite}
.shooting::after{content:'';position:absolute;width:var(--tl);height:2px;top:0;right:3px;background:linear-gradient(to left,rgba(255,255,255,.8),rgba(255,255,255,.3),transparent);transform:rotate(var(--ta));transform-origin:right center}
@keyframes shoot{0%{opacity:0;transform:translate(0,0)}3%{opacity:1}20%{opacity:.8;transform:translate(var(--mx),var(--my))}25%,100%{opacity:0;transform:translate(var(--mx),var(--my))}}

#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(var(--navH) + 30px + env(safe-area-inset-bottom))}
#app.full{max-width:none;padding:0}
#app.nonav{padding-bottom:calc(110px + env(safe-area-inset-bottom))}

/* 헤더 */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:4px 0 10px}
.logo{font-size:17px;color:#fff;text-shadow:0 0 18px rgba(247,183,49,.5),0 0 34px rgba(233,69,96,.3)}
.logo em{font-style:normal;color:var(--gold)}
.tag{font-size:13px;color:var(--sub);margin-top:6px}
h1.t{font-size:20px}
.sub{font-size:13px;color:var(--sub)}

/* 카드 */
.card{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold),#6c5ce7,var(--accent));background-size:300% 100%;animation:grad 4s linear infinite}
@keyframes grad{to{background-position:300% 50%}}
.stitle{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.stitle::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.stitle span{font-family:'Galmuri11';font-size:12px;color:var(--sub)}

/* 픽셀 버튼 */
.pbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;clip-path:var(--notch);background:var(--gold);color:#1a1a2e;font-weight:700;padding:16px;font-size:17px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),inset 0 4px 0 rgba(255,255,255,.35);margin:10px 0;font-family:'Galmuri14','Galmuri11',sans-serif}
.pbtn:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),inset 0 4px 0 rgba(255,255,255,.35)}
.pbtn.red{background:var(--accent);color:#fff}
.pbtn.dark{background:var(--card);color:var(--text);box-shadow:inset 0 -5px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.08)}
.pbtn.ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent)}
.pbtn.small{padding:11px;font-size:14px}
.pbtn .px{flex:none}
.start-btn{flex-direction:column;gap:6px;padding:22px 16px}
.start-btn b{font-size:22px}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.catch-btn{padding:20px 16px;min-height:140px;flex-direction:row;font-size:30px;position:relative}
.catch-btn .pf{position:absolute;bottom:12px;right:14px;font-size:8px;color:#5a3d00}

/* 씬 */
.stage{position:relative;height:190px;border-radius:14px;overflow:hidden;border:2px solid var(--line);margin:12px 0}
.stage.compact{height:132px}
.time-night{background:linear-gradient(180deg,#050810 0%,#0a0e1a 25%,#0d1225 55%,#101530 80%,#15203a 100%)}
.time-dawn{background:linear-gradient(180deg,#1a1030 0%,#2d1845 20%,#6b3a6b 45%,#e8855a 75%,#f0c060 100%)}
.time-morning{background:linear-gradient(180deg,#4a90d9 0%,#7ab8f5 30%,#a0d4ff 60%,#d0e8ff 85%,#e8f0e0 100%)}
.time-afternoon{background:linear-gradient(180deg,#2e7bcf 0%,#5a9fe0 30%,#87bff0 60%,#b0d8ff 85%,#d8ecf0 100%)}
.time-sunset{background:linear-gradient(180deg,#1a1040 0%,#4a2060 20%,#c05050 45%,#f0885a 70%,#f0c060 100%)}
.time-evening{background:linear-gradient(180deg,#08081a 0%,#0d1030 30%,#15204a 65%,#1a2a50 100%)}
.stage .tb{position:absolute;top:8px;left:10px;font-size:7px;color:rgba(255,255,255,.55);z-index:4}
.stage .sstar{position:absolute;width:2px;height:2px;background:#fff;animation:twinkle var(--dur) ease-in-out infinite}
.stage .cel{position:absolute;top:14px;right:18px;filter:drop-shadow(0 0 12px rgba(253,203,110,.55))}
.compact .cel{top:8px;transform:scale(.75);transform-origin:top right}
.stage .ground{position:absolute;left:0;bottom:0;width:50%;height:42px;background:linear-gradient(180deg,#2d5a2a,#1e4a20);z-index:1}
.stage .slope{position:absolute;left:50%;bottom:0;width:6%;height:42px;background:linear-gradient(135deg,#2d5a2a 30%,#1a3520 50%,#15304a 70%,rgba(15,45,75,.95) 100%);z-index:1}
.stage .water{position:absolute;left:56%;right:0;bottom:0;height:42px;background:linear-gradient(180deg,#0d3050,#0a2540 30%,#081e35);z-index:1;overflow:hidden}
.stage .water::before{content:'';position:absolute;top:4px;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent 10%,rgba(100,180,255,.3) 30%,transparent 50%,rgba(100,180,255,.25) 70%,transparent 90%);animation:shim 3s ease-in-out infinite}
.stage .water::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent,rgba(80,160,240,.07) 25px,transparent 50px);animation:wave 5s ease-in-out infinite}
@keyframes shim{0%,100%{opacity:.3;transform:translateX(0)}50%{opacity:.85;transform:translateX(10px)}}
@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(12px)}}
.stage .el{position:absolute;z-index:2}
.stage .tent{left:3%;bottom:40px}
.stage .fire{left:33%;bottom:40px;z-index:3}
.stage .rod{left:calc(43% + 30px);bottom:14px;z-index:3}
.stage .reed1{right:5%;bottom:20px}
.stage .reed2{right:31%;bottom:16px}
.stage .jump{right:15%;bottom:12px;opacity:0;animation:fishJump 8s ease-in-out infinite 3s}
@keyframes fishJump{0%,100%{opacity:0;transform:translateY(0) rotate(0)}5%{opacity:1;transform:translateY(0) rotate(-10deg)}15%{opacity:1;transform:translateY(-38px) rotate(15deg)}22%{opacity:1;transform:translateY(-50px) rotate(-5deg) scaleX(-1)}30%{opacity:1;transform:translateY(-40px) rotate(-15deg)}40%{opacity:.8;transform:translateY(-18px) rotate(-10deg)}45%{opacity:0;transform:translateY(6px)}46%,100%{opacity:0}}
.stage .cat{position:absolute;bottom:38px;z-index:5;cursor:pointer}
.stage .cat.boo{left:20%}
.stage .cat.dende{left:43%}
.stage .note{position:absolute;z-index:4;font-size:14px;opacity:0;color:var(--gold);animation:note var(--d) ease-in-out infinite var(--dl)}
@keyframes note{0%{opacity:0;transform:translateY(0)}15%{opacity:.85}60%{opacity:.5;transform:translateY(-36px) rotate(15deg) translateX(8px)}100%{opacity:0;transform:translateY(-60px) rotate(-10deg)}}
.jumpy{animation:catJump .4s ease}
@keyframes catJump{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}

/* 말풍선 */
.bubble{position:absolute;background:rgba(22,33,62,.96);border:2px solid var(--gold);border-radius:10px;padding:6px 10px;font-size:13px;color:var(--gold);white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;z-index:8;box-shadow:0 4px 15px rgba(0,0,0,.5),0 0 10px rgba(247,183,49,.15)}
.bubble.show{opacity:1}
.bubble.tail::after{content:'';position:absolute;bottom:-10px;left:16px;border:5px solid transparent;border-top-color:var(--gold)}
#say{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-10px);display:flex;align-items:flex-end;gap:4px;z-index:60;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;width:max-content;max-width:94vw}
#say.show{opacity:1;transform:translateX(-50%) translateY(0)}
#say .bubble{position:relative;opacity:1;white-space:normal;font-size:13px;margin-bottom:22px}
#say .bubble::after{content:'';position:absolute;bottom:6px;left:-10px;border:5px solid transparent;border-right-color:var(--gold)}

/* 상태 표시 */
.sync{display:inline-flex;gap:7px;align-items:center;font-size:12px;color:var(--sub);background:rgba(15,52,96,.6);border:2px solid var(--line);padding:5px 10px;border-radius:8px}
.sync .dot{width:8px;height:8px;background:var(--green)}
.sync.off .dot{background:var(--gold)} .sync.err .dot{background:var(--accent)}

/* 기록판 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.stat b{display:block;font-family:'Press Start 2P',monospace;font-size:16px;color:#fff;margin-bottom:6px}
.stat b.gold{color:var(--gold);text-shadow:0 0 10px rgba(247,183,49,.35)}
.stat span{font-size:12px;color:var(--sub)}

/* 목록 */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;padding:11px 12px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px}
.row:active{border-color:var(--gold)}
.row .len{font-family:'Press Start 2P',monospace;font-size:15px;min-width:58px;color:#fff}
.row .len small{font-size:7px;color:var(--sub);margin-left:2px}
.row .meta{flex:1;font-size:13.5px;line-height:1.55;color:var(--sub);min-width:0}
.row .meta b{color:var(--text);font-weight:400}
.t1{color:var(--green)!important} .t2{color:var(--gold)!important} .t3{color:var(--accent)!important}
.badge{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--sub);white-space:nowrap}
.badge.warn{background:rgba(247,183,49,.15);color:var(--gold)}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:14px 0 6px}
.empty .px{margin:0 auto 8px}

/* 입력 */
label.f{display:block;color:var(--sub);font-size:13px;font-weight:600;margin:16px 0 7px}
label.f:first-child{margin-top:0}
input.t,textarea.t{width:100%;background:rgba(0,0,0,.25);border:2px solid var(--line);color:var(--text);border-radius:8px;padding:12px;font-size:15px}
textarea.t{min-height:110px;resize:vertical;line-height:1.6}
input.t:focus,textarea.t:focus{outline:none;border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{clip-path:var(--notch);background:var(--card);padding:9px 13px;font-size:14px;color:var(--text);box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.chip small{color:var(--sub);margin-left:5px;font-size:11px}
.chip.on{background:var(--gold);color:#1a1a2e;font-weight:700;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.chip.on small{color:#5a3d00}
.chip.add{background:transparent;color:var(--sub);box-shadow:inset 0 0 0 2px var(--line)}
.inline{display:flex;gap:8px;margin-top:9px}
.inline input{flex:1;min-width:0}
.inline button{clip-path:var(--notch);background:var(--gold);color:#1a1a2e;font-weight:700;padding:0 16px}
.weather{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
.msg{font-size:13px;white-space:pre-line;margin-top:8px}
.msg.err{color:var(--accent)}
.link{display:block;margin:14px auto 0;color:var(--sub);font-size:13px;text-decoration:underline}
footer{text-align:center;padding:26px 0 8px;font-family:'Press Start 2P',monospace;font-size:7px;color:#3a3a5a;line-height:2.2}

/* 하단 탭 */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg2);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#nav.hide{display:none}
#nav button{flex:1;max-width:186px;height:var(--navH);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--sub)}
#nav button i{font-style:normal;font-size:20px;filter:grayscale(.6)}
#nav button.on{color:var(--gold)}
#nav button.on i{filter:none}
#nav button.on::before{content:'';position:absolute;top:0;width:28px;height:3px;background:var(--gold)}
#nav button{position:relative}

/* 바텀 시트 */
#sheetWrap{position:fixed;inset:0;background:rgba(5,5,20,.7);display:none;z-index:40}
#sheetWrap.show{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);border-top:3px solid var(--gold);border-radius:16px 16px 0 0;max-height:94vh;overflow-y:auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom))}
.shead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.x{width:40px;height:40px;clip-path:var(--notch);background:var(--card);font-size:16px}
.saveBar{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:8px;z-index:45}
.saveBar .pbtn{margin:0}
.lenWrap{display:flex;align-items:flex-end;justify-content:center;gap:10px;position:relative;margin:4px 0 12px;min-height:84px}
.lenBox{font-family:'Press Start 2P',monospace;font-size:40px;color:var(--gold);text-shadow:0 0 18px rgba(247,183,49,.45)}
.lenBox small{font-size:13px;color:var(--sub);margin-left:6px}
.lenBox.empty{color:#3a3a5a;text-shadow:none}
.lenWrap .bubble{position:absolute;top:-4px;left:0;opacity:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pad button{clip-path:var(--notch);background:var(--card);padding:15px 0;font-family:'Press Start 2P',monospace;font-size:17px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.06)}
.pad button:active{background:#16457a;transform:translateY(2px)}
.box{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:14px;margin-top:16px}
.photo{display:flex;gap:10px;align-items:center;margin-top:16px}
.photo label{clip-path:var(--notch);background:var(--card);padding:11px 15px;font-size:14px}
.photo img{width:60px;height:60px;object-fit:cover;border:2px solid var(--gold);border-radius:6px}
.stars-pick .chip{font-size:17px;padding:6px 11px;color:var(--gold)}
.stars-pick .chip.on{color:#1a1a2e}

/* 축하 */
#cele{position:fixed;inset:0;z-index:70;background:rgba(8,8,25,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
#cele.show{display:flex}
#cele .bigbass{animation:celeJump 1s ease-in-out infinite}
@keyframes celeJump{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-24px) rotate(8deg)}}
#cele .clen{font-family:'Press Start 2P',monospace;font-size:34px;color:var(--gold);text-shadow:0 0 20px rgba(247,183,49,.6),0 0 40px rgba(233,69,96,.3)}
#cele .clen.t3{color:var(--accent)!important;text-shadow:0 0 22px rgba(233,69,96,.7)}
#cele .cwho{display:flex;align-items:flex-end;gap:6px}
#cele .bubble{position:relative;opacity:1;font-size:14px;margin-bottom:28px}
#cele .tap{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--sub)}
.spark{position:absolute;width:6px;height:6px;background:var(--gold);animation:spark 1.2s ease-out infinite;opacity:0}
@keyframes spark{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--sx),var(--sy))}}


/* 사진 뷰어 */
#viewer{position:fixed;inset:0;z-index:80;background:rgba(5,5,20,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
#viewer.show{display:flex}
#viewer .vimg{max-width:94vw;max-height:66vh;border:3px solid var(--gold);border-radius:6px;box-shadow:0 0 30px rgba(247,183,49,.25);background:#000}
#viewer .vcap{font-size:13px;color:var(--sub);text-align:center}
#viewer .vcap b{display:block;font-size:22px;margin-bottom:6px}
#viewer .vcap small{font-size:9px;margin-left:3px}
#viewer .vnav{display:flex;gap:14px;align-items:center}
#viewer .vnav .pbtn{width:64px;margin:0}
#viewer .vx{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px}
.camb{font-size:18px;padding:4px}
.photo img{cursor:pointer}
.pphoto{position:relative;margin:-2px -2px 8px;cursor:pointer}
.pphoto img{display:block;width:100%;max-width:230px;height:150px;object-fit:cover;border:2px solid var(--gold);border-radius:6px;background:#000}
.pphoto span{position:absolute;right:6px;bottom:6px;font-size:9px;background:rgba(0,0,0,.7);color:#fff;padding:3px 5px}

/* 오늘의 공략 */
.reco .rk{display:flex;gap:10px;align-items:flex-start;margin-top:10px}
.reco .rk>span{flex:none;width:40px;font-size:13px;color:var(--sub);padding-top:6px}
.tg{display:inline-block;clip-path:var(--notch);background:var(--card);padding:6px 10px;font-size:13px;margin:0 6px 6px 0}
.tg.top{background:var(--gold);color:#1a1a2e;font-weight:700}
.tg small{color:var(--sub);margin-left:4px;font-size:11px}
.tg.top small{color:#5a3d00}
.why{list-style:none;margin-top:12px;font-size:14px;line-height:1.55;color:var(--text);display:flex;flex-direction:column;gap:6px}
.why li{padding-left:14px;position:relative}
.why li::before{content:'▸';position:absolute;left:0;color:var(--gold)}
.mine{margin-top:12px;font-size:13.5px;background:rgba(139,195,74,.08);border:1px solid rgba(139,195,74,.35);border-radius:8px;padding:8px 10px}
.recoHead{display:flex;gap:8px;align-items:flex-end;margin-bottom:4px}
.recoHead .bubble{position:relative;opacity:1;white-space:normal;margin-bottom:18px}
.recoToggle{width:100%;text-align:left}

/* 출조 상세 */
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn.lbl{cursor:pointer}
.tphotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tphotos img{width:64px;height:64px;object-fit:cover;border:2px solid var(--line);border-radius:6px;cursor:pointer}
.bpi{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

const SPR = {};
function spr(name, s){
  const k = name + '@' + s; if (SPR[k]) return SPR[k];
  const [kind, arg, opt] = name.split(':');
  const size = { cat:[16,15], mini:[14,10], bass:[18,9], tent:[17,10], fire:[8,10], rod:[20,25], moon:[12,12], sun:[12,12], reed:[10,10] }[kind];
  const cv = document.createElement('canvas'); cv.width = size[0] * s; cv.height = size[1] * s;
  const ctx = cv.getContext('2d');
  const p = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x * s, y * s, s, s); };
  if (kind === 'cat') drawCat(p, arg, opt === 'sleep');
  if (kind === 'mini') drawMini(p, arg);
  if (kind === 'bass') rowsDraw(p, BASS_ROWS, BASS_PAL);
  if (kind === 'reed') rowsDraw(p, REED_ROWS, REED_PAL);
  if (kind === 'tent') drawTent(p);
  if (kind === 'fire') drawFire(p, +arg);
  if (kind === 'rod') drawRod(p);
  if (kind === 'moon' || kind === 'sun') drawOrb(p, kind === 'moon');
  return SPR[k] = cv.toDataURL();
}
const img = (name, s, cls = '', attr = '') => `<img class="px ${cls}" src="${spr(name, s)}" alt="" ${attr}>`;

function applyLocal(s, row){
  const k = KEY[s], list = DB[s] || (DB[s] = []);
  const i = list.findIndex(r => r[k] === row[k]);
  if (i >= 0) list[i] = { ...list[i], ...row }; else list.push({ ...row });
}
function removeLocal(s, id){ DB[s] = rows(s).filter(r => r[KEY[s]] !== id); }
function write(s, row){ applyLocal(s, row); save(LS.data, DB); enqueue({ action:'upsert', sheet:s, row }); }

function nextId(s, prefix, len){
  const max = rows(s).reduce((m, r) => {
    const id = r[KEY[s]] || ''; const n = id.startsWith(prefix) ? parseInt(id.slice(prefix.length), 10) : NaN;
    return isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return prefix + String(max + 1).padStart(len, '0');
}

/* ═════════ 서버 통신 ═════════ */
async function apiGet(params){
  const u = API_URL + '?' + new URLSearchParams(params);
  try { const r = await fetch(u); return await r.json(); }
  catch (e) { return jsonp(u); }
}
function jsonp(u){
  return new Promise((res, rej) => {
    const cb = 'jp' + uid(), s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); };
    window[cb] = d => { done(); res(d); };
    s.onerror = () => { done(); rej(new Error('연결 실패')); };
    s.src = u + '&callback=' + cb; document.head.appendChild(s);
    setTimeout(() => { if (window[cb]) { done(); rej(new Error('시간 초과')); } }, 25000);
  });
}
async function apiPost(body){
  const r = await fetch(API_URL, { method:'POST', body: JSON.stringify(body) });
  return r.json();
}
function enqueue(op){ op.op_id = uid(); queue.push(op); save(LS.queue, queue); updateSync(); setTimeout(flush, 300); }

async function flush(){
  if (flushing || !navigator.onLine || !DB) return;
  const ops = queue.filter(o => (o.tries || 0) < MAX_TRIES).slice(0, 40);
  if (!ops.length) return;
  flushing = true; updateSync();
  try {
    const res = await apiPost({ action:'batch', ops: ops.map(({ tries, error, ...o }) => o) });
    if (!res.results) throw new Error(res.error || '응답 오류');
    const ok = new Set(res.results.filter(r => r.ok).map(r => r.op_id));
    res.results.filter(r => !r.ok).forEach(r => {
      const o = queue.find(q => q.op_id === r.op_id);
      if (o) { o.tries = (o.tries || 0) + 1; o.error = r.error; }
    });
    queue = queue.filter(o => !ok.has(o.op_id)); save(LS.queue, queue); lastErr = '';
    if (ok.size && queue.some(o => (o.tries || 0) < MAX_TRIES)) setTimeout(flush, 500);
  } catch (e) { lastErr = e.message || String(e); }
  flushing = false; updateSync();
}
async function refresh(){
  const res = await apiGet({ action:'all' });
  if (!res.ok) throw new Error(res.error || '불러오기 실패');
  DB = res.data;
  queue.forEach(o => { if (o.action === 'upsert') applyLocal(o.sheet, o.row); if (o.action === 'delete') removeLocal(o.sheet, o.id); });
  save(LS.data, DB);
}

const idb = (() => {
  let pr;
  const open = () => pr || (pr = new Promise((res, rej) => {
    const r = indexedDB.open('bass-log', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath:'photo_id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => { const t = db.transaction('photos', mode), q = fn(t.objectStore('photos')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); });
  };
  return { put: v => tx('readwrite', s => s.put(v)), del: id => tx('readwrite', s => s.delete(id)), all: () => tx('readonly', s => s.getAll()) };
})();
async function refreshPhotos(){
  try { const list = await idb.all(); photoCount = list.length;
    localPhotoMap = {}; localTripMap = {}; localKind = {};
    list.slice().sort((a, b) => a.photo_id.localeCompare(b.photo_id)).forEach(p => { if (KINDS.includes(p.is_cover)) localKind[p.trip_id + '|' + p.is_cover] = p.data; });
    list.filter(p => !KINDS.includes(p.is_cover)).forEach(p => { const m = p.catch_id ? localPhotoMap : localTripMap, k = p.catch_id || p.trip_id; if (k) (m[k] = m[k] || []).push(p.data); });
    photoCatchIds = new Set([...list.map(p => p.catch_id), ...rows('Photos').map(p => p.catch_id)].filter(Boolean));

function resizeImage(file){
  return new Promise((res, rej) => {
    const im = new Image(), url = URL.createObjectURL(file);
    im.onload = () => {
      const s = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 못 읽었어…')); };
    im.src = url;
  });
}
async function uploadPhotos(){

      applyLocal('Photos', { ...meta, drive_file_id: r.drive_file_id }); await idb.del(p.photo_id); done++;

function startGPS(){
  if (watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(p => {
    const first = !pos; pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    if (first && view === 'start') { loadWeather(); render(); }
    if (view === 'map') placeMe();
  }, () => {}, { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
}
function stopGPS(){ if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; }
function distKm(a, b){
  const R = 6371, d = x => x * Math.PI / 180, dLat = d(b.lat - a.lat), dLng = d(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(d(a.lat)) * Math.cos(d(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const WMO = c => c === 0 ? '맑음' : c <= 2 ? '구름 조금' : c === 3 ? '흐림' : c <= 48 ? '안개' : c <= 57 ? '이슬비' : c <= 67 ? '비' : c <= 77 ? '눈' : c <= 82 ? '소나기' : c <= 86 ? '눈' : '뇌우';
const DIR = d => ['북','북동','동','남동','남','남서','서','북서'][Math.round(d / 45) % 8];
async function loadWeather(){
  if (!sf || !navigator.onLine) return;
  const spot = byId('Spots', sf.spot_id);
  const at = (spot && +spot.lat && +spot.lng) ? { lat: +spot.lat, lng: +spot.lng } : pos;
  if (!at) return;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${at.lat}&longitude=${at.lng}&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure&wind_speed_unit=ms&timezone=Asia%2FSeoul`;
    const c = (await (await fetch(u)).json()).current;
    sf.weather = { weather: WMO(c.weather_code), air_temp: Math.round(c.temperature_2m * 10) / 10, wind: `${DIR(c.wind_direction_10m)} ${Math.round(c.wind_speed_10m)}m/s`, pressure: Math.round(c.surface_pressure) };
    if (view === 'start') render();

function timeInfo(){
  const h = new Date().getHours();
  if (h >= 5 && h < 7)  return ['time-dawn', 'DAWN', false];
  if (h >= 7 && h < 11) return ['time-morning', 'MORNING', false];
  if (h >= 11 && h < 16) return ['time-afternoon', 'DAY', false];
  if (h >= 16 && h < 19) return ['time-sunset', 'SUNSET', false];
  if (h >= 19 && h < 21) return ['time-evening', 'EVENING', true];
  return ['time-night', 'NIGHT', true];
}

function recommend(src){

  const typed = src.water_temp !== '' && src.water_temp != null && !isNaN(+src.water_temp);
  const wt = typed ? +src.water_temp : MONTH_WT[month - 1];
  const S = { rig:{}, worm:{}, act:{}, depth:{}, color:{} }, why = [];
  const add = (k, list, w = 1) => list.forEach(x => S[k][x] = (S[k][x] || 0) + w);

    why.push(`수온 ${wt}℃ — 아직 차가워. 브레이크라인·깊은 쪽 바닥 위주로 느리게`);
  } else if (wt < 16) {

    why.push(`수온 ${wt}℃ — 연안으로 붙는 시기(${ses === '가을' ? '가을 피딩' : '봄 산란 준비'}). 얕은 곳부터 브레이크라인까지 넓게`);
  } else if (wt < 22) {

    why.push(`수온 ${wt}℃ — 활성 좋은 구간. 넓게 탐색하고 반응 빠른 채비로`);

    why.push(`수온 ${wt}℃ — 여름 패턴. 아침저녁은 연안·표층, 낮엔 그늘·수초 속`);
  } else {

  // 수위

  else if (cl === '탁함') { add('color', ['블랙/블루', '주니뱅', '차트'], 3); add('worm', ['컬리테일', '크리처·호그'], 2); why.push('물 탁함 — 진한 실루엣 컬러, 파동 큰 웜'); }
  else if (cl === '흙탕') { add('color', ['블랙/블루', '차트', '화이트'], 3); add('rig', ['텍사스', '러버지그', '하드베이트'], 2); why.push('흙탕 — 진동·실루엣 우선 (스피너베이트·바이브레이션도)'); }
  else add('color', /흐림|비/.test(wx) ? ['블랙/블루', '화이트'] : ['그린펌킨', '워터멜론'], 1);

  const top = (o, n) => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, n).map(x => x[0]);

}
// 내 기록 중 비슷한 조건(수온 ±3℃, 수온 기록 없으면 같은 계절)
function myPattern(r, exceptTrip){
  const sims = rows('Catches').filter(c => {
    if (c.trip_id === exceptTrip) return false;
    const t = byId('Trips', c.trip_id); if (!t) return false;
    const twt = parseFloat(t.water_temp);
    return !isNaN(twt) ? Math.abs(twt - r.wt) <= 3 : season(t.date) === r.ses;
  });
  if (sims.length < 2) return null;
  const cnt = k => { const m = {}; sims.forEach(c => { if (c[k]) m[c[k]] = (m[c[k]] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1])[0]; };
  const rig = cnt('rig'), lure = cnt('lure_id');
  return { n: sims.length, rig, lure: lure && [lureName(lure[0]), lure[1]], max: sims.reduce((m, c) => Math.max(m, +c.length_cm || 0), 0) };
}
function setupFor(rig, ids){
  const pool = (ids && ids.length ? ids.map(id => byId('Setups', id)).filter(Boolean) : active('Setups'));
  const s = pool.find(s => s.default_rig === rig) || pool.find(s => (s.use || '').includes(rig));
  return s ? s.name : '';
}

const tod = t => { if (!t) return ''; const h = +String(t).slice(0, 2); return h >= 4 && h < 7 ? '새벽' : h >= 7 && h < 11 ? '오전' : h >= 11 && h < 16 ? '낮' : h >= 16 && h < 19 ? '해질녘' : '밤'; };
function filtered(){

    document.head.appendChild(s); setTimeout(() => { if (!done) rej(new Error('시간 초과')); }, timeout);
  });
}

/* 지도 엔진 어댑터: 같은 함수로 네이버 / Leaflet 둘 다 그림 */
function naverAdapter(el = 'map', mini = false){
  const N = naver.maps, LL = (a, b) => new N.LatLng(a, b);
  const types = ['HYBRID', 'SATELLITE', 'NORMAL'], labels = { HYBRID:'🛰 위성+지명', SATELLITE:'🛰 위성', NORMAL:'🗺 일반' };
  let base = load('bl_base_n', 'HYBRID'); if (!labels[base]) base = 'HYBRID';
  const map = new N.Map(el, {
    center: LL(36.5, 127.8), zoom: 7, mapTypeId: N.MapTypeId[base],
    zoomControl: !mini, zoomControlOptions: { position: N.Position.RIGHT_BOTTOM, style: N.ZoomControlStyle.SMALL },
    mapDataControl: false, scaleControl: false, logoControlOptions: { position: N.Position.BOTTOM_LEFT },
  });
  const info = new N.InfoWindow({ content: '', backgroundColor: 'transparent', borderWidth: 0, disableAnchor: true, pixelOffset: new N.Point(0, -10) });
  const g = { catch: [], spot: [], line: [] };
  let me = null, showCatch = true;
  if (!mini) N.Event.addListener(map, 'zoom_changed', zoomVis);
  N.Event.addListener(map, 'click', () => info.close());
  return {
    kind: 'naver',
    clear(){ info.close(); Object.values(g).forEach(arr => { arr.forEach(o => o.setMap(null)); arr.length = 0; }); },
    marker(k, lat, lng, html, size, anchor, z, popup){
      const m = new N.Marker({ position: LL(lat, lng), map: (k === 'catch' && !showCatch) ? null : map, zIndex: 100 + z,
        icon: { content: html, size: new N.Size(size[0], size[1]), anchor: new N.Point(anchor[0], anchor[1]) } });
      N.Event.addListener(m, 'click', () => { info.setContent(`<div class="popc nPop">${popup}</div>`); info.open(map, m); });
      g[k].push(m);
    },
    line(pts){ g.line.push(new N.Polyline({ map, path: pts.map(p => LL(p[0], p[1])), strokeColor: '#f7b731', strokeWeight: 3, strokeOpacity: .9, strokeStyle: 'shortdash' })); },
    fit(pts){
      const b = new N.LatLngBounds(LL(pts[0][0], pts[0][1]), LL(pts[0][0], pts[0][1]));
      pts.forEach(p => b.extend(LL(p[0], p[1])));
      map.fitBounds(b, mini ? { top: 40, right: 30, bottom: 30, left: 30 } : { top: 100, right: 50, bottom: 60, left: 50 });
      if (map.getZoom() > 17) map.setZoom(17);
    },
    view(pt, z){ map.setCenter(LL(pt[0], pt[1])); map.setZoom(z); },
    zoom(){ return map.getZoom(); },
    catchesVisible(v){ if (v === showCatch) return; showCatch = v; g.catch.forEach(m => m.setMap(v ? map : null)); },
    me(lat, lng, html){ if (me) me.setPosition(LL(lat, lng)); else me = new N.Marker({ position: LL(lat, lng), map, zIndex: 2000, icon: { content: html, anchor: new N.Point(14, 10) } }); },
    baseLabel(){ return labels[base]; },
    nextBase(){ base = types[(types.indexOf(base) + 1) % types.length]; save('bl_base_n', base); map.setMapTypeId(N.MapTypeId[base]); },
    destroy(){ info.close(); map.destroy(); },
  };
}
function leafletAdapter(el = 'map', mini = false){
  const map = L.map(el, { zoomControl: false }).setView([36.5, 127.8], 7);
  if (!mini) L.control.zoom({ position: 'bottomright' }).addTo(map);
  const bases = {
    sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, maxNativeZoom: 18, attribution: 'Tiles © Esri' }),
    dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, subdomains: 'abcd', attribution: '© OpenStreetMap © CARTO' }),
  };
  let base = load('bl_base', 'sat'); if (!bases[base]) base = 'sat'; bases[base].addTo(map);
  const g = { spot: L.layerGroup().addTo(map), line: L.layerGroup().addTo(map), catch: L.layerGroup().addTo(map) };
  let me = null;
  if (!mini) map.on('zoomend', zoomVis);
  return {
    kind: 'leaflet',
    clear(){ Object.values(g).forEach(l => l.clearLayers()); },
    marker(k, lat, lng, html, size, anchor, z, popup){
      L.marker([lat, lng], { icon: L.divIcon({ className: '', html, iconSize: size, iconAnchor: anchor, popupAnchor: [0, 4 - anchor[1]] }), zIndexOffset: z })
        .bindPopup(`<div class="popc">${popup}</div>`).addTo(g[k]);
    },
    line(pts){ L.polyline(pts, { color: '#f7b731', weight: 3, dashArray: '6 6', opacity: .9 }).addTo(g.line); },
    fit(pts){ map.fitBounds(pts, { padding: [50, 50], maxZoom: 17 }); },
    view(pt, z){ map.setView(pt, z); },
    zoom(){ return map.getZoom(); },
    catchesVisible(v){ if (v && !map.hasLayer(g.catch)) map.addLayer(g.catch); if (!v && map.hasLayer(g.catch)) map.removeLayer(g.catch); },
    me(lat, lng, html){ if (me) me.setLatLng([lat, lng]); else me = L.marker([lat, lng], { icon: L.divIcon({ className: '', html, iconSize: [28, 20], iconAnchor: [14, 10] }), zIndexOffset: 1000 }).addTo(map); },
    baseLabel(){ return base === 'sat' ? '🛰 위성' : '🌙 다크'; },
    nextBase(){ map.removeLayer(bases[base]); base = base === 'sat' ? 'dark' : 'sat'; save('bl_base', base); bases[base].addTo(map); },
    destroy(){ map.remove(); },
  };
}

/* ═════════ 화면: 출조 브리핑 (STAGE CLEAR) ═════════ */
const toMin = s => { if (!s) return null; const [h, m] = String(s).split(':').map(Number); return isNaN(h) ? null : h * 60 + (m || 0); };
const fmtDur = m => m == null || m < 0 ? '-' : `${Math.floor(m / 60)}:${pad(m % 60)}`;
function openBrief(id){
  if (trip && trip.trip_id === id) { view = 'trip'; render(); return; }
  if (!byId('Trips', id)) return;
  briefId = id; view = 'brief'; render(); window.scrollTo(0, 0);
}
function achievements(t, cs){
  const list = [], sorted = cs.filter(c => c.time).sort((a, b) => a.time.localeCompare(b.time));
  const max = cs.reduce((m, c) => Math.max(m, +c.length_cm || 0), 0);
  if (!cs.length) return [['🫠', '꽝도 경험치', '다음 판에 계속!']];
  if (sorted.length && t.start) { const d = toMin(sorted[0].time) - toMin(t.start); if (d >= 0 && d <= 30) list.push(['⚡', '첫 수 30분 컷', `시작 ${d}분 만에 첫 수`]); }
  if (max >= 50) list.push(['👑', '괴물 사냥꾼', `${max}cm 50업!`]); else if (max >= 40) list.push(['🏆', '40업 달성', `최대 ${max}cm`]);
  const prev = rows('Catches').filter(c => { const tt = byId('Trips', c.trip_id); return tt && tt.trip_id !== t.trip_id && (tt.date || '') <= (t.date || ''); });
  const prevMax = prev.reduce((m, c) => Math.max(m, +c.length_cm || 0), 0);
  if (prevMax && max > prevMax) list.push(['🎖', '개인 신기록', `${prevMax} → ${max}cm`]);
  let combo = 0;
  sorted.forEach((c, i) => { let k = i; while (k + 1 < sorted.length && toMin(sorted[k + 1].time) - toMin(c.time) <= 30) k++; combo = Math.max(combo, k - i + 1); });
  if (combo >= 2) list.push(['🔥', `${combo}연타`, '30분 안에 연속 히트']);
  if (cs.length >= 5) list.push(['🐟', '대량 조과', `${cs.length}수 돌파`]);
  const lu = groupCount(cs, c => c.lure_id)[0];
  if (lu && lu.n >= 3 && byId('Lures', lu.k)) list.push(['🎯', '원 루어 마스터', `${lureName(lu.k)}로 ${lu.n}수`]);
  const rigs = new Set(cs.map(c => c.rig).filter(Boolean)); if (rigs.size >= 3) list.push(['🧰', '멀티 리그', `${rigs.size}가지 리그로 잡음`]);
  if (cs.some(c => tod(c.time) === '새벽')) list.push(['🌅', '새벽 출근', '해 뜨기 전 손맛']);
  if (cs.filter(c => tod(c.time) === '해질녘').length >= 2) list.push(['🌇', '해질녘 사냥꾼', '피딩 타임 접수']);
  const pt = tripsDesc().filter(x => x.trip_id !== t.trip_id && (x.date || '') <= (t.date || '') && x.trip_id < t.trip_id)[0];
  if (pt && !tripCatches(pt.trip_id).length) list.push(['💪', '꽝 극복', '지난번 꽝 → 오늘 손맛']);
  if (t.water_temp !== '' && t.water_temp != null && +t.water_temp < 10) list.push(['🥶', '혹한기 전사', `수온 ${t.water_temp}℃에서 잡음`]);
  return list;
}
function talkLines(t, cs, hasScene, hasSelfie){

// 사진 여러 장: EXIF 촬영 시각 → 가장 가까운 조과(60분 이내)에 자동 연결
async function exifDate(file){
  try {
    const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
    if (v.getUint16(0) !== 0xFFD8) return null;
    let o = 2;
    while (o < v.byteLength - 4) {
      const m = v.getUint16(o), len = v.getUint16(o + 2);
      if (m === 0xFFE1 && v.getUint32(o + 4) === 0x45786966) {
        const t = o + 10, le = v.getUint16(t) === 0x4949;
        const u16 = q => v.getUint16(q, le), u32 = q => v.getUint32(q, le);
        const str = (q, n) => { let r = ''; for (let i = 0; i < n - 1; i++) r += String.fromCharCode(v.getUint8(q + i)); return r; };
        const scan = (ifd, tags) => { const out = {}, n = u16(t + ifd); for (let i = 0; i < n; i++) { const e = t + ifd + 2 + i * 12, tag = u16(e); if (tags.includes(tag)) out[tag] = tag === 0x8769 ? u32(e + 8) : str(t + u32(e + 8), u32(e + 4)); } return out; };
        const ifd0 = scan(u32(t + 4), [0x8769, 0x0132]);
        let d = ifd0[0x8769] ? scan(ifd0[0x8769], [0x9003])[0x9003] : null;
        d = d || ifd0[0x0132];
        const mm = d && d.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2})/);
        return mm ? new Date(+mm[1], mm[2] - 1, +mm[3], +mm[4], +mm[5]) : null;
      }
      if ((m & 0xFF00) !== 0xFF00) break;
      o += 2 + len;
    }
  } catch (e) {}
  return null;
}
async function onBulk(files){

    let best = '', bd = Infinity;

    items.push({ data, when, exif: !!ex, catch_id: bd <= 60 * 60000 ? best : '' });
  }
  if (!items.length) return say('사진을 못 읽었어…', 'dende');
  bp = { trip_id: tdId, items }; showSheet(vBulk);
}

  if (navigator.onLine) uploadPhotos(); else say(`사진 ${n}장 저장했어! 와이파이에서 올리자`, 'boo');
}

/* ═════════ 화면: 기록 (패턴 노트·기록판) ═════════ */
const WT_BUCKETS = [['~8℃', -99, 8], ['8–12℃', 8, 12], ['12–16℃', 12, 16], ['16–22℃', 16, 22], ['22–26℃', 22, 26], ['26℃~', 26, 99]];
function statsData(){
  const now = new Date(), y = String(now.getFullYear());
  const cut = new Date(now - 90 * 864e5), cutS = ymd(cut);
  const trips = rows('Trips').filter(t => t.date && (statsP === 'all' || (statsP === 'year' ? t.date.startsWith(y) : t.date >= cutS)));
  const ids = new Set(trips.map(t => t.trip_id));
  return { trips, catches: rows('Catches').filter(c => ids.has(c.trip_id)) };
}
function groupCount(list, keyFn){
  const m = {}; list.forEach(c => { const k = keyFn(c); if (!k) return; (m[k] = m[k] || []).push(c); });
  return Object.entries(m).map(([k, a]) => ({ k, n: a.length, avg: Math.round(a.reduce((s, c) => s + (+c.length_cm || 0), 0) / a.length), max: a.reduce((s, c) => Math.max(s, +c.length_cm || 0), 0) })).sort((a, b) => b.n - a.n);
}
function hbars(list, label, value, text, cls){
  const max = Math.max(...list.map(value), 1);
  return `<div class="bars">${list.map(x => `<div class="bar ${cls ? cls(x) : ''}"><span class="bl">${esc(label(x))}</span>
    <div class="bt"><div class="bf" style="width:${Math.max(2, value(x) / max * 100)}%"></div></div><span class="bv">${esc(text(x))}</span></div>`).join('')}</div>`;
}
function cols(list, cls){
  const max = Math.max(...list.map(x => x.n), 1);
  return `<div class="cols">${list.map(x => `<div class="col ${cls ? cls(x) : ''}" title="${esc(x.label)} ${x.n}수">${x.n ? `<span class="cv">${x.n}</span>` : ''}<div class="cf" style="height:${x.n / max * 82}%"></div></div>`).join('')}</div>
    <div class="colx">${list.map(x => `<span>${esc(x.label)}</span>`).join('')}</div>`;
}
function patternNotes(trips, cs){
  const notes = [], pct = (a, b) => Math.round(a / b * 100);
  if (cs.length >= 3) {
    const r = groupCount(cs, c => c.rig)[0];
    if (r) notes.push(`리그 1위 <b>${esc(r.k)}</b> — 전체의 ${pct(r.n, cs.length)}% (${r.n}/${cs.length}수)`);
  }
  SEASONS.forEach(se => {
    const sc = cs.filter(c => season(catchDate(c)) === se);
    if (sc.length >= 3) { const r = groupCount(sc, c => c.rig)[0]; if (r && r.n >= 2) notes.push(`<b>${se}</b>엔 ${esc(r.k)} — ${se} ${sc.length}수 중 ${r.n}수`); }
  });
  const wt = WT_BUCKETS.map(([l, a, b]) => {
    const ts = trips.filter(t => t.water_temp !== '' && !isNaN(+t.water_temp) && +t.water_temp >= a && +t.water_temp < b);
    const n = cs.filter(c => ts.some(t => t.trip_id === c.trip_id)).length;
    return { l, trips: ts.length, per: ts.length ? n / ts.length : 0 };
  }).filter(x => x.trips >= 2).sort((a, b) => b.per - a.per)[0];
  if (wt && wt.per > 0) notes.push(`수온 <b>${wt.l}</b>에서 출조당 ${wt.per.toFixed(1)}수로 가장 좋았어 (${wt.trips}회 출조)`);
  const td = groupCount(cs, c => tod(c.time))[0];
  if (td && td.n >= 2) notes.push(`<b>${td.k}</b>에 가장 많이 잡았어 — ${td.n}수, 평균 ${td.avg}cm`);
  const big = cs.filter(c => +c.length_cm >= 40);
  if (big.length >= 2) {
    const r = groupCount(big, c => c.rig)[0], t2 = groupCount(big, c => tod(c.time))[0];
    const parts = [r && r.n >= 2 ? `${esc(r.k)} ${r.n}마리` : '', t2 && t2.n >= 2 ? `${esc(t2.k)} ${t2.n}마리` : ''].filter(Boolean);
    notes.push(`40업 <b>${big.length}마리</b>${parts.length ? ' — ' + parts.join(', ') : ' — 아직 뚜렷한 공통점은 없어'}`);
  }
  const lu = groupCount(cs, c => c.lure_id).filter(x => byId('Lures', x.k))[0];
  if (lu && lu.n >= 2) notes.push(`최애 루어 <b>${esc(lureName(lu.k))}</b> — ${lu.n}수, 평균 ${lu.avg}cm`);
  const zero = trips.filter(t => !cs.some(c => c.trip_id === t.trip_id)).length;
  if (trips.length >= 3) notes.push(`꽝 ${zero}회 / 출조 ${trips.length}회 — 꽝 비율 ${pct(zero, trips.length)}%`);
  return notes;
}
function vStats(){
  const { trips, catches: cs } = statsData();
  const per = trips.length ? (cs.length / trips.length).toFixed(1) : '-';
  const max = cs.reduce((m, c) => Math.max(m, +c.length_cm || 0), 0);
  const avg = cs.length ? Math.round(cs.reduce((s, c) => s + (+c.length_cm || 0), 0) / cs.length) : 0;
  const zero = trips.filter(t => !cs.some(c => c.trip_id === t.trip_id)).length;
  const head = `<div class="head"><div><h1 class="t">기록판</h1><div class="sub pf" style="font-size:8px;margin-top:6px">HIGH SCORE</div></div></div>
    ${chipsRaw('statsP', statsP, [{ v:'all', label:'전체' }, { v:'year', label:'올해' }, { v:'90', label:'최근 90일' }])}`;
  if (!cs.length) return head + `<div class="card"><div class="empty">${img('cat:boo:sleep', 4)}${trips.length ? '이 기간엔 아직 잡은 고기가 없어…' : '아직 기록이 없어 zzZ'}<br>잡을수록 패턴이 보여!</div></div>`;
  const notes = patternNotes(trips, cs);
  const rig = groupCount(cs, c => c.rig).slice(0, 8);
  const lure = groupCount(cs, c => c.lure_id).filter(x => byId('Lures', x.k)).slice(0, 5);
  const setup = groupCount(cs, c => c.setup_id).filter(x => byId('Setups', x.k)).slice(0, 6);
  const tods = TODS.map(k => ({ k, ...(groupCount(cs, c => tod(c.time)).find(x => x.k === k) || { n: 0, avg: 0 }) }));
  const wts = WT_BUCKETS.map(([l, a, b]) => {
    const ts = trips.filter(t => t.water_temp !== '' && !isNaN(+t.water_temp) && +t.water_temp >= a && +t.water_temp < b);
    const n = cs.filter(c => ts.some(t => t.trip_id === c.trip_id)).length;
    return { k: l, trips: ts.length, n, per: ts.length ? n / ts.length : 0 };
  }).filter(x => x.trips);
  const months = Array.from({ length: 12 }, (_, i) => ({ label: String(i + 1), n: cs.filter(c => +catchDate(c).slice(5, 7) === i + 1).length }));
  const sizes = [[0, 25, '~25'], [25, 30, '25'], [30, 35, '30'], [35, 40, '35'], [40, 45, '40'], [45, 50, '45'], [50, 999, '50+']]
    .map(([a, b, l]) => ({ label: l, a, n: cs.filter(c => +c.length_cm >= a && +c.length_cm < b).length }));
  return head + `
  <div class="card"><div class="stitle">SUMMARY</div><div class="tiles">
    <div class="stat"><b>${trips.length}</b><span>출조</span></div><div class="stat"><b>${cs.length}</b><span>마릿수</span></div><div class="stat"><b>${per}</b><span>출조당</span></div>
    <div class="stat"><b class="gold">${max}</b><span>최대어 cm</span></div><div class="stat"><b>${avg}</b><span>평균 cm</span></div><div class="stat"><b>${trips.length ? Math.round(zero / trips.length * 100) : 0}%</b><span>꽝 비율</span></div></div></div>
  ${notes.length ? `<div class="card"><div class="stitle">PATTERN NOTE <span>덴데의 분석</span></div>
    <div class="recoHead">${img('cat:dende', 3)}<div class="bubble tail">기록 ${cs.length}수로 찾은 패턴이야!</div></div>
    <ul class="notes">${notes.map(n => `<li>${n}</li>`).join('')}</ul>
    ${cs.length < 15 ? '<div class="small-note">아직 기록이 적어서 참고만! 쌓일수록 정확해져.</div>' : ''}</div>` : ''}
  <div class="card"><div class="stitle">RIG <span>리그별</span></div>${hbars(rig, x => x.k, x => x.n, x => `${x.n}수 · 평균 ${x.avg}cm`)}</div>
  ${lure.length ? `<div class="card"><div class="stitle">LURE <span>루어 TOP 5</span></div>${hbars(lure, x => lureName(x.k), x => x.n, x => `${x.n}수 · 최대 ${x.max}cm`)}</div>` : ''}
  ${wts.length ? `<div class="card"><div class="stitle">WATER TEMP <span>수온대별 출조당 마릿수</span></div>${hbars(wts, x => x.k, x => x.per, x => `${x.per.toFixed(1)}수 (${x.trips}회)`)}
    <div class="small-note">수온을 입력한 출조만 계산해.</div></div>` : ''}
  <div class="card"><div class="stitle">TIME <span>시간대별</span></div>${hbars(tods, x => x.k, x => x.n, x => x.n ? `${x.n}수 · 평균 ${x.avg}cm` : '0', x => x.n ? '' : 'dim')}</div>
  <div class="card"><div class="stitle">MONTH <span>월별 마릿수</span></div>${cols(months)}</div>
  <div class="card"><div class="stitle">SIZE <span>사이즈 분포 (cm)</span></div>${cols(sizes, x => x.a >= 40 ? 't3' : '')}</div>
  ${setup.length ? `<div class="card"><div class="stitle">TACKLE <span>세팅별</span></div>${hbars(setup, x => byId('Setups', x.k).name, x => x.n, x => `${x.n}수 · 최대 ${x.max}cm`)}</div>` : ''}
  <footer>DEVELOPED BY DONGGU KANG<br>DENDE & BOO FOREVER</footer>`;
}
// 상태 하나짜리 칩 (기간 선택 등)
function chipsRaw(key, cur, list){
  return `<div class="chips" style="margin-bottom:4px">${list.map(o => `<button class="chip ${cur === o.v ? 'on' : ''}" data-act="raw" data-k="${key}" data-v="${o.v}">${esc(o.label)}</button>`).join('')}</div>`;
}

/* ═════════ 하단 탭 · 렌더 ═════════ */
function vNav(){
  const tab = view === 'map' ? 'map' : view === 'settings' ? 'settings' : view === 'stats' ? 'stats' : 'home';
  return `<button class="${tab === 'home' ? 'on' : ''}" data-act="tabHome"><i>${trip ? '🎣' : '⛺'}</i>${trip ? '출조중' : '홈'}</button>
    <button class="${tab === 'stats' ? 'on' : ''}" data-act="tabStats"><i>📊</i>기록</button>
    <button class="${tab === 'map' ? 'on' : ''}" data-act="tabMap"><i>🗺</i>지도</button>
    <button class="${tab === 'settings' ? 'on' : ''}" data-act="settings"><i>⚙</i>관리</button>`;
}
function render(){
  destroyMap();
  const app = $('#app'), top = window.scrollY;
  app.className = view === 'map' ? 'full' : (view === 'start' || view === 'detail') ? 'nonav' : '';
  app.innerHTML = view === 'loading' ? vLoading() : view === 'settings' ? vSettings() : view === 'start' ? vStart() : view === 'trip' ? vTrip() : view === 'map' ? vMap() : view === 'brief' ? vBrief() : view === 'detail' ? vDetail() : view === 'stats' ? vStats() : vHome();
  const nav = $('#nav'); nav.className = (view === 'start' || view === 'loading' || view === 'detail') ? 'hide' : ''; nav.innerHTML = vNav();
  if (view === 'start' || view === 'trip' || view === 'detail' || view === 'brief') window.scrollTo(0, top);
  if (view === 'map') initMap();
  if (view === 'brief') initBriefMap();
}

/* ═════════ 시트 공통 ═════════ */
function showSheet(fn){ sheetFn = fn; $('#sheet').innerHTML = fn(); $('#sheet').scrollTop = 0; $('#sheetWrap').classList.add('show'); }
function hideSheet(){ $('#sheetWrap').classList.remove('show'); sheetFn = null; cf = null; ef = null; }
function rerenderSheet(){ if (!sheetFn) return; const s = $('#sheet'), t = s.scrollTop; s.innerHTML = sheetFn(); s.scrollTop = t; }

/* ═════════ 이벤트 ═════════ */
document.addEventListener('click', async e => {
  if (e.target.closest('#cele')) { $('#cele').classList.remove('show'); return; }
  if (e.target.id === 'viewer') { vw = null; drawViewer(); return; }
  const catEl = e.target.closest('.stage .cat'); if (catEl) return catTalk(catEl.dataset.cat);
  const el = e.target.closest('[data-act],[data-f],[data-key]');
  if (!el) { if (e.target.id === 'sheetWrap') hideSheet(); return; }

  if (el.dataset.f) {
    const f = el.dataset.f, k = el.dataset.k, v = el.dataset.v, form = forms()[f];
    if (el.dataset.multi) form[k] = form[k].includes(v) ? form[k].filter(x => x !== v) : [...form[k], v];
    else form[k] = form[k] === v && k !== 'setup_id' && k !== 'released' ? '' : v;
    if (f === 'cf' && k === 'setup_id') { const st = byId('Setups', v); if (st && st.default_rig) cf.rig = st.default_rig; }
    if (f === 'cf' && k === 'lure_id') { const l = byId('Lures', cf.lure_id); if (l && l.default_rig) cf.rig = l.default_rig; }
    if (f === 'sf' && k === 'spot_id') loadWeather();
    return (f === 'sf' || f === 'td') ? render() : rerenderSheet();
  }
  if (el.dataset.key) {
    const k = el.dataset.key; let s = String(cf.length || '');
    if (k === '⌫') s = s.slice(0, -1);
    else if (k === '.') { if (!s.includes('.') && s) s += '.'; }
    else if (s.replace('.', '').length < 4) s = (s === '0' ? '' : s) + k;
    cf.length = s; return rerenderSheet();
  }
  switch (el.dataset.act) {
    case 'tabHome': view = trip ? 'trip' : 'home'; render(); window.scrollTo(0, 0); break;
    case 'tabMap': view = 'map'; render(); break;
    case 'settings': view = 'settings'; render(); window.scrollTo(0, 0); break;
    case 'home': view = trip ? 'trip' : 'home'; if (!trip) stopGPS(); render(); break;
    case 'boot': boot(); break;
    case 'flush': lastErr = ''; queue.forEach(o => { if ((o.tries || 0) >= MAX_TRIES) o.tries = MAX_TRIES - 1; }); flush(); say('보내볼게!', 'boo'); break;
    case 'retryFailed': queue.forEach(o => { o.tries = 0; }); save(LS.queue, queue); flush(); render(); break;
    case 'dropFailed': if (confirmTap('drop')) { queue = queue.filter(o => (o.tries || 0) < MAX_TRIES); save(LS.queue, queue); render(); } break;
    case 'refresh':
      try { say('불러오는 중…', 'boo'); await refresh(); await refreshPhotos(); render(); say('최신 데이터로 바꿨어!', 'boo'); }
      catch (err) { say('불러오기 실패: ' + err.message, 'boo'); }
      break;
    case 'upPhotos': uploadPhotos(); break;
    case 'start': openStart(); break;
    case 'newSpot': sf.newSpot = true; render(); $('#newSpotName').focus(); break;
    case 'addSpot': {
      const name = $('#newSpotName').value.trim(); if (!name) return say('이름을 알려줘!', 'boo');
      const id = nextId('Spots', 'S', 3);
      write('Spots', { spot_id: id, name, type:'', lat: pos ? pos.lat.toFixed(6) : '', lng: pos ? pos.lng.toFixed(6) : '', share_level:'지역만', active:'Y' });
      sf.spot_id = id; sf.newSpot = false; render(); loadWeather(); break;
    }
    case 'newComp': sf.newComp = true; render(); $('#newCompName').focus(); break;
    case 'addComp': { const n = $('#newCompName').value.trim(); if (n && !sf.companions.includes(n)) sf.companions.push(n); sf.newComp = false; render(); break; }
    case 'beginTrip': beginTrip(); break;
    case 'catch': openCatch(); break;
    case 'editCatch': openCatch(el.dataset.id); break;
    case 'openTrip': openDetail(el.dataset.id); break;
    case 'detailBack': if (tdId && byId('Trips', tdId)) { briefId = tdId; view = 'brief'; } else view = 'home'; render(); window.scrollTo(0, 0); break;
    case 'openBrief': openBrief(el.dataset.id); break;
    case 'briefBack': view = 'home'; render(); window.scrollTo(0, 0); break;
    case 'photosKind': { const ph = kindPhoto(el.dataset.id, el.dataset.kind); if (ph) { vw = { id: el.dataset.id, list: [ph], i: 0 }; drawViewer(); } break; }
    case 'editCatchT': openCatch(el.dataset.id, tdId); break;
    case 'addCatchT': openCatch(null, tdId); break;
    case 'saveTrip': saveTrip(false); break;
    case 'finishReview': saveTrip(true); break;
    case 'bpSet': bp.items[+el.dataset.i].catch_id = el.dataset.v; rerenderSheet(); break;
    case 'bpSave': bpSave(); break;
    case 'tabStats': view = 'stats'; render(); window.scrollTo(0, 0); break;
    case 'raw': if (el.dataset.k === 'statsP') { statsP = el.dataset.v; save('bl_statsP', statsP); render(); } break;
    case 'closeSheet': hideSheet(); break;
    case 'allLures': cf.allLures = true; rerenderSheet(); break;
    case 'newLure': cf.newLure = true; rerenderSheet(); $('#nl_name').focus(); break;
    case 'addLure': {
      const name = $('#nl_name').value.trim(), color = $('#nl_color').value.trim();
      if (!name) return say('루어 이름 알려줘!', 'dende');
      const id = nextId('Lures', 'L', 3); write('Lures', { lure_id: id, category:'소프트', name, color, active:'Y' });
      cf.lure_id = id; cf.newLure = false; rerenderSheet(); break;
    }
    case 'moreCatch': cf.more = true; rerenderSheet(); break;
    case 'saveCatch': saveCatch(); break;
    case 'delCatch': delCatch(); break;
    case 'end': openEnd(); break;
    case 'finishTrip': finishTrip(); break;
    case 'mapTrip': {
      const id = el.dataset.id;
      if (!tripCatches(id).some(c => +c.lat)) return say('이 출조는 위치 기록이 없어…', 'dende');
      mf = { lure:[], rig:[], season:[], tod:[], size:'', trip: id }; save(LS.map, mf); view = 'map'; render(); break;
    }
    case 'photos': e.stopPropagation(); openViewer(el.dataset.id, +el.dataset.i || 0); break;
    case 'vwClose': vw = null; drawViewer(); break;
    case 'vwPrev': vw.i = (vw.i - 1 + vw.list.length) % vw.list.length; drawViewer(); break;
    case 'vwNext': vw.i = (vw.i + 1) % vw.list.length; drawViewer(); break;
    case 'recoToggle': recoOpen = !recoOpen; { const rc = $('#recoCard'); if (rc) rc.innerHTML = vReco(tripSrc(), true); } break;
    case 'mapFilter': showSheet(vFilter); break;
    case 'mapApply': save(LS.map, mf); hideSheet(); render(); break;
    case 'mapReset': mf = { lure:[], rig:[], season:[], tod:[], size:'', trip:'' }; save(LS.map, mf); hideSheet(); render(); break;
    case 'mapTripClear': mf.trip = ''; save(LS.map, mf); render(); break;
    case 'mapBase':
      if (!M) break;
      M.nextBase(); el.textContent = M.baseLabel(); break;
    case 'mapMe':
      startGPS();
      if (pos && M) { placeMe(); M.view([pos.lat, pos.lng], Math.max(M.zoom(), 15)); } else say('위치 찾는 중…', 'dende');
      break;
  }
});
document.addEventListener('input', e => {
  const p = e.target.dataset && e.target.dataset.in; if (!p) return;
  const [f, k] = p.split('.'); forms()[f][k] = e.target.value;

document.addEventListener('change', async e => {

  try { cf.photo = await resizeImage(e.target.files[0]); rerenderSheet(); } catch (err) { say(err.message, 'dende'); }
});
window.addEventListener('online', () => { updateSync(); flush(); });
window.addEventListener('offline', updateSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });
setInterval(flush, 30000);
setInterval(() => { const el = $('#elapsed'); if (el) el.textContent = elapsed(curTrip()); }, 30000);

/* ═════════ 별 배경 ═════════ */
(function(){
  const c = $('#stars'); let h = '';
  for (let i = 0; i < 80; i++) { const big = Math.random() > .7; h += `<i class="star" style="left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${2+Math.random()*4}s;animation-delay:${Math.random()*3}s${big ? ';width:3px;height:3px' : ''}"></i>`; }
  for (let i = 0; i < 3; i++) {
    const mx = 150 + Math.random() * 200, my = 80 + Math.random() * 150;
    h += `<i class="shooting" style="left:${5+Math.random()*60}%;top:${3+Math.random()*35}%;--mx:${mx}px;--my:${my}px;--tl:${50+Math.random()*80}px;--ta:${Math.atan2(my, mx) * 180 / Math.PI}deg;--sd:${8+Math.random()*10}s;--sdl:${i*6+Math.random()*8}s"></i>`;
  }
  c.innerHTML = h;
})();

/* ═════════ 시작 ═════════ */
window.BL = { spr, drawCat, drawMini };
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (trip) startGPS();
render();
if (view === 'loading') boot(); else { refreshPhotos(); flush(); }
