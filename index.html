<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>배스 조행기</title>
<style>
:root{
  --bg:#0e1714; --card:#16231e; --card2:#1d2e27; --line:#2a3d34;
  --text:#e9f1ec; --sub:#93a89c; --accent:#c4f25a; --accent-ink:#1a2a07;
  --warn:#f2b45a; --danger:#f07167; --ok:#6fd49a;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.45}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:14px 16px 40px}
h1{font-size:22px;margin:0}
h2{font-size:15px;color:var(--sub);font-weight:600;margin:26px 0 10px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.top .sub{color:var(--sub);font-size:13px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.icon{background:var(--card);width:42px;height:42px;border-radius:12px;font-size:19px}
.hero{display:block;width:100%;background:var(--accent);color:var(--accent-ink);font-weight:800;
  font-size:24px;padding:26px 0;border-radius:20px;margin:14px 0;box-shadow:0 6px 0 #7fa82d}
.hero:active{transform:translateY(4px);box-shadow:0 2px 0 #7fa82d}
.hero.catch{font-size:34px;padding:46px 0}
.wide{display:block;width:100%;background:var(--card2);padding:15px;border-radius:var(--r);font-weight:600;margin:10px 0}
.wide.primary{background:var(--accent);color:var(--accent-ink);font-weight:800}
.wide.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
.ghost{background:transparent;color:var(--sub);text-decoration:underline;padding:10px;display:block;margin:14px auto}
.sync{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub);background:var(--card);
  padding:8px 12px;border-radius:999px;width:fit-content}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.off .dot{background:var(--warn)}
.sync.err .dot{background:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats div{background:var(--card);border-radius:var(--r);padding:12px;text-align:center;color:var(--sub);font-size:13px}
.stats b{display:block;color:var(--text);font-size:24px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center}
.row .len{font-size:22px;font-weight:800;min-width:64px}
.row .meta{color:var(--sub);font-size:13px;flex:1}
.row .meta b{color:var(--text);font-weight:600}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--sub);white-space:nowrap}
.badge.warn{background:#3a2f1a;color:var(--warn)}
.empty{color:var(--sub);text-align:center;padding:24px 0}
label.f{display:block;color:var(--sub);font-size:13px;margin:16px 0 6px}
input.t{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--text);
  border-radius:12px;padding:13px 14px;font:inherit}
input.t:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1.5px solid var(--line);padding:9px 14px;border-radius:999px;font-size:15px}
.chip small{color:var(--sub);margin-left:4px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.on small{color:var(--accent-ink)}
.chip.add{border-style:dashed;color:var(--sub)}
.inline{display:flex;gap:8px;margin-top:8px}
.inline input{flex:1}
.inline button{background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:12px;padding:0 16px}
.muted{color:var(--sub);font-size:13px}
.msg{margin-top:10px;font-size:14px;white-space:pre-line}
.msg.ok{color:var(--ok)} .msg.err{color:var(--danger)}
footer{text-align:center;color:#4f6459;font-size:11px;letter-spacing:.12em;margin-top:40px}

/* 바텀 시트 */
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:10}
#sheetWrap.show{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--bg);
  border-radius:22px 22px 0 0;max-height:94vh;overflow-y:auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.sheetHead{display:flex;justify-content:space-between;align-items:center}
.saveBar{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,var(--bg) 30%);display:flex;gap:8px;z-index:11}
.saveBar .wide{margin:0}
.lenBox{text-align:center;font-size:56px;font-weight:800;margin:6px 0 4px;letter-spacing:-1px}
.lenBox span{font-size:22px;color:var(--sub);margin-left:6px}
.lenBox.empty{color:#3d5247}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{background:var(--card);padding:16px 0;border-radius:14px;font-size:24px;font-weight:700}
.pad button:active{background:var(--card2)}
.more{background:var(--card);border-radius:var(--r);padding:4px 14px 14px;margin-top:16px}
.photo{display:flex;gap:10px;align-items:center;margin-top:10px}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.photo label{background:var(--card2);padding:12px 16px;border-radius:12px;font-weight:600}
.stars .chip{font-size:20px;padding:6px 12px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%);
  background:#f4f8f5;color:#0e1714;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;width:max-content;max-width:90vw;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheetWrap"><div id="sheet"></div></div>
<div id="toast"></div>
<script>
/* 배스 조행기 — 현장 입력
   DEVELOPED BY DONGGU KANG */

const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbwno2F5-wiQ8jQIwexBaFTpfY61xvZPqqHS40FzQfE3DuNnCNUtoeq_hhwOkKc5l-3v/exec';
const LS = { cfg:'bl_cfg', data:'bl_data', queue:'bl_queue', trip:'bl_trip', last:'bl_last' };
const KEY = { Trips:'trip_id', Catches:'catch_id', Spots:'spot_id', Lures:'lure_id', Photos:'photo_id',
              Tackle:'tackle_id', Setups:'setup_id', Options:'option_id' };
const MAX_TRIES = 5;

/* ───────── 유틸 ───────── */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('폰 저장 공간이 부족해요'); } };
const pad = n => String(n).padStart(2, '0');
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm  = (d = new Date()) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const stamp = (d = new Date()) => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

/* ───────── 상태 ───────── */
let cfg   = load(LS.cfg, { url: DEFAULT_URL, key: '', me: '본인' });
let DB    = load(LS.data, null);
let queue = load(LS.queue, []);
let trip  = load(LS.trip, null);        // { trip_id }
let last  = load(LS.last, {});          // 직전 선택값
let view  = (!cfg.key || !DB) ? 'settings' : (trip ? 'trip' : 'home');
let sf = null, cf = null, ef = null;     // 출조 시작 / 조과 / 종료 폼
let pos = null, watchId = null;
let photoCount = 0, photoCatchIds = new Set();
let flushing = false, lastErr = '';

/* ───────── 데이터 ───────── */
const rows = s => (DB && DB[s]) || [];
const byId = (s, id) => rows(s).find(r => r[KEY[s]] === id);
const active = s => rows(s).filter(r => r.active !== 'N');
const opts = g => rows('Options').filter(o => o.group === g && o.active !== 'N')
  .sort((a, b) => (+a.order || 0) - (+b.order || 0)).map(o => o.value);

function applyLocal(s, row){
  const k = KEY[s], list = DB[s] || (DB[s] = []);
  const i = list.findIndex(r => r[k] === row[k]);
  if (i >= 0) list[i] = { ...list[i], ...row }; else list.push({ ...row });
}
function removeLocal(s, id){ DB[s] = rows(s).filter(r => r[KEY[s]] !== id); }

function write(s, row){ applyLocal(s, row); save(LS.data, DB); enqueue({ action:'upsert', sheet:s, row }); }
function remove(s, id){ removeLocal(s, id); save(LS.data, DB); enqueue({ action:'delete', sheet:s, id }); }

function nextId(s, prefix, len){
  const max = rows(s).reduce((m, r) => {
    const id = r[KEY[s]] || ''; const n = id.startsWith(prefix) ? parseInt(id.slice(prefix.length), 10) : NaN;
    return isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return prefix + String(max + 1).padStart(len, '0');
}

/* ───────── 서버 통신 ───────── */
async function apiGet(params){
  const u = cfg.url + '?' + new URLSearchParams({ key: cfg.key, ...params });
  try { const r = await fetch(u); return await r.json(); }
  catch (e) { return jsonp(u); }
}
function jsonp(u){
  return new Promise((res, rej) => {
    const cb = 'jp' + uid(), s = document.createElement('script');
    const done = () => { delete window[cb]; s.remove(); };
    window[cb] = d => { done(); res(d); };
    s.onerror = () => { done(); rej(new Error('연결 실패')); };
    s.src = u + '&callback=' + cb; document.head.appendChild(s);
    setTimeout(() => { if (window[cb]) { done(); rej(new Error('시간 초과')); } }, 25000);
  });
}
async function apiPost(body){
  const r = await fetch(cfg.url, { method:'POST', body: JSON.stringify({ ...body, key: cfg.key }) });
  return r.json();
}

function enqueue(op){
  op.op_id = uid(); queue.push(op); save(LS.queue, queue);
  updateSync(); setTimeout(flush, 300);
}

async function flush(){
  if (flushing || !navigator.onLine || !cfg.key) return;
  const ops = queue.filter(o => (o.tries || 0) < MAX_TRIES).slice(0, 40);
  if (!ops.length) return;
  flushing = true; updateSync();
  try {
    const res = await apiPost({ action:'batch', ops: ops.map(({ tries, error, ...o }) => o) });
    if (!res.results) throw new Error(res.error || '응답 오류');
    const ok = new Set(res.results.filter(r => r.ok).map(r => r.op_id));
    res.results.filter(r => !r.ok).forEach(r => {
      const o = queue.find(q => q.op_id === r.op_id);
      if (o) { o.tries = (o.tries || 0) + 1; o.error = r.error; }
    });
    queue = queue.filter(o => !ok.has(o.op_id));
    save(LS.queue, queue); lastErr = '';
    if (ok.size && queue.some(o => (o.tries || 0) < MAX_TRIES)) setTimeout(flush, 500);
  } catch (e) {
    lastErr = e.message || String(e);
  }
  flushing = false; updateSync();
}

/** 서버 데이터 받아오고, 아직 안 보낸 변경은 그 위에 다시 적용 */
async function refresh(){
  const res = await apiGet({ action:'all' });
  if (!res.ok) throw new Error(res.error || '불러오기 실패');
  DB = res.data;
  queue.forEach(o => {
    if (o.action === 'upsert') applyLocal(o.sheet, o.row);
    if (o.action === 'delete') removeLocal(o.sheet, o.id);
  });
  save(LS.data, DB);
}

/* ───────── 사진 (IndexedDB, 업로드 전까지 폰에 보관) ───────── */
const idb = (() => {
  let p;
  const open = () => p || (p = new Promise((res, rej) => {
    const r = indexedDB.open('bass-log', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath:'photo_id' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('photos', mode), req = fn(t.objectStore('photos'));
      t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
    });
  };
  return { put: v => tx('readwrite', s => s.put(v)), del: id => tx('readwrite', s => s.delete(id)), all: () => tx('readonly', s => s.getAll()) };
})();

async function refreshPhotos(){
  try {
    const list = await idb.all();
    photoCount = list.length;
    photoCatchIds = new Set([...list.map(p => p.catch_id), ...rows('Photos').map(p => p.catch_id)].filter(Boolean));
  } catch (e) { photoCount = 0; }
  updateSync();
}

function resizeImage(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 읽을 수 없어요')); };
    img.src = url;
  });
}

async function uploadPhotos(){
  if (!navigator.onLine) return toast('오프라인이에요');
  const list = await idb.all(); let done = 0, fail = 0;
  for (const p of list) {
    toast(`사진 올리는 중 ${done + fail + 1}/${list.length}`);
    try {
      const res = await apiPost({ action:'uploadPhoto', ...p });
      const r = res.results && res.results[0];
      if (!r || !r.ok) throw new Error((r && r.error) || res.error);
      const { data, mime, ...meta } = p;
      applyLocal('Photos', { ...meta, drive_file_id: r.drive_file_id });
      await idb.del(p.photo_id); done++;
    } catch (e) { fail++; lastErr = e.message; }
  }
  save(LS.data, DB); await refreshPhotos(); render();
  toast(fail ? `${done}장 완료, ${fail}장 실패` : `사진 ${done}장 업로드 완료`);
}

/* ───────── 위치·날씨 ───────── */
function startGPS(){
  if (watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(
    p => { const first = !pos; pos = { lat: p.coords.latitude, lng: p.coords.longitude }; if (first && view === 'start') { loadWeather(); render(); } },
    () => {}, { enableHighAccuracy: true, maximumAge: 30000, timeout: 20000 });
}
function stopGPS(){ if (watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; }

function distKm(a, b){
  const R = 6371, d = x => x * Math.PI / 180;
  const dLat = d(b.lat - a.lat), dLng = d(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(d(a.lat)) * Math.cos(d(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

const WMO = c => c === 0 ? '맑음' : c <= 2 ? '구름 조금' : c === 3 ? '흐림' : c <= 48 ? '안개'
  : c <= 57 ? '이슬비' : c <= 67 ? '비' : c <= 77 ? '눈' : c <= 82 ? '소나기' : c <= 86 ? '눈' : '뇌우';
const DIR = d => ['북','북동','동','남동','남','남서','서','북서'][Math.round(d / 45) % 8];

async function loadWeather(){
  if (!sf || !navigator.onLine) return;
  const spot = byId('Spots', sf.spot_id);
  const at = (spot && spot.lat && spot.lng) ? { lat: +spot.lat, lng: +spot.lng } : pos;
  if (!at) return;
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${at.lat}&longitude=${at.lng}`
      + '&current=temperature_2m,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure&wind_speed_unit=ms&timezone=Asia%2FSeoul';
    const c = (await (await fetch(u)).json()).current;
    sf.weather = { weather: WMO(c.weather_code), air_temp: Math.round(c.temperature_2m * 10) / 10,
      wind: `${DIR(c.wind_direction_10m)} ${Math.round(c.wind_speed_10m)}m/s`, pressure: Math.round(c.surface_pressure) };
    if (view === 'start') render();
  } catch (e) {}
}

/* ───────── 화면 조각 ───────── */
function syncBar(){
  const failed = queue.filter(o => (o.tries || 0) >= MAX_TRIES).length;
  const cls = !navigator.onLine ? 'off' : (lastErr || failed) ? 'err' : '';
  const label = flushing ? '전송 중' : !navigator.onLine ? '오프라인' : lastErr ? '전송 오류' : '온라인';
  return `<button class="sync ${cls}" data-act="flush"><span class="dot"></span>${label}
    · 대기 ${queue.length}건${failed ? ` (실패 ${failed})` : ''}${photoCount ? ` · 사진 ${photoCount}장` : ''}</button>`;
}
function updateSync(){ document.querySelectorAll('.sync').forEach(el => el.outerHTML = syncBar()); }

/** f: 폼 이름, k: 필드, list: [{v,label,sub}], multi: 여러 개 선택 */
function chips(f, k, list, multi){
  const form = { sf, cf, ef }[f], cur = form[k];
  return `<div class="chips">${list.map(o => {
    const on = multi ? cur.includes(o.v) : cur === o.v;
    return `<button class="chip ${on ? 'on' : ''}" data-f="${f}" data-k="${k}" data-v="${esc(o.v)}" ${multi ? 'data-multi="1"' : ''}>${esc(o.label ?? o.v)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</button>`;
  }).join('')}</div>`;
}
const simple = arr => arr.map(v => ({ v }));

function lureName(id){ const l = byId('Lures', id); return l ? [l.brand, l.name].filter(Boolean).join(' ') : ''; }
function setupLabel(s){
  const line = byId('Tackle', s.line_id);
  return { v: s.setup_id, label: s.name || s.setup_id, sub: line && line.spec1 ? line.spec1 + 'lb' : '' };
}
function spotName(id){ const s = byId('Spots', id); return s ? s.name : '포인트 미정'; }

function tripCatches(id){ return rows('Catches').filter(c => c.trip_id === id).sort((a, b) => (a.time || '').localeCompare(b.time || '')); }
function usage(field){ const m = {}; rows('Catches').forEach(c => { if (c[field]) m[c[field]] = (m[c[field]] || 0) + 1; }); return m; }

/* ───────── 화면: 설정 ───────── */
function vSettings(){
  const failed = queue.filter(o => (o.tries || 0) >= MAX_TRIES);
  return `
  <div class="top"><h1>설정</h1>${DB ? '<button class="icon" data-act="home">✕</button>' : ''}</div>
  <p class="muted">입력한 값은 이 기기 브라우저에만 저장돼요. 코드나 GitHub에는 들어가지 않아요.</p>
  <label class="f">웹 앱 URL</label><input class="t" id="s_url" value="${esc(cfg.url)}">
  <label class="f">API 키 (setup 실행 로그에 나온 값)</label><input class="t" id="s_key" value="${esc(cfg.key)}" autocomplete="off" autocapitalize="off">
  <label class="f">잡은 사람 기본 이름</label><input class="t" id="s_me" value="${esc(cfg.me)}">
  <button class="wide primary" data-act="connect">연결 확인 · 데이터 불러오기</button>
  <div class="msg" id="connMsg"></div>
  ${failed.length ? `<h2>전송 실패 ${failed.length}건</h2>
    <div class="list">${failed.map(o => `<div class="row"><div class="meta"><b>${esc(o.action)} ${esc(o.sheet || '')}</b><br>${esc(o.error || '')}</div></div>`).join('')}</div>
    <button class="wide" data-act="retryFailed">다시 시도</button>
    <button class="wide danger" data-act="dropFailed">실패 항목 버리기</button>` : ''}
  <footer>DEVELOPED BY DONGGU KANG</footer>`;
}

async function connect(){
  cfg = { url: $('#s_url').value.trim(), key: $('#s_key').value.trim(), me: $('#s_me').value.trim() || '본인' };
  save(LS.cfg, cfg);
  const msg = $('#connMsg'); msg.className = 'msg'; msg.textContent = '연결 확인 중…';
  try {
    const g = await apiGet({ action:'ping' });
    if (!g.ok) throw new Error(g.error);
    const p = await apiPost({ action:'batch', ops: [] });
    if (!p.ok) throw new Error(p.error || '쓰기 확인 실패');
    msg.textContent = '연결됨. 데이터 불러오는 중…';
    await refresh();
    msg.className = 'msg ok';
    msg.textContent = `✅ 완료 — 세팅 ${active('Setups').length}개 · 루어 ${active('Lures').length}개 · 포인트 ${active('Spots').length}개`;

    msg.className = 'msg err';
    msg.textContent = '❌ ' + (e.message || e) + '\n키와 URL, 웹 앱 배포 권한(모든 사용자)을 확인해 주세요.';
  }
}

function elapsed(t){

  const [h, m] = t.start.split(':').map(Number), s = new Date(); s.setHours(h, m, 0, 0);
  const min = Math.max(0, Math.round((Date.now() - s) / 60000));
  return Math.floor(min / 60) + ':' + pad(min % 60);
}

      structure: '', depth: last.depth || '', weight_g: '', color: '', memo: '', released: 'Y', angler: cfg.me,
      length: '', photo: null, more: false, allLures: false, newLure: false, edit: false };
    if (cf.lure_id && !byId('Lures', cf.lure_id)) cf.lure_id = '';
  }
  cf.todaySetups = today;
  showSheet(vCatch());

function lureOptions(){
  const order = [], seen = new Set();
  rows('Catches').slice().sort((a, b) => (b.catch_id || '').localeCompare(a.catch_id || '')).forEach(c => {
    if (c.lure_id && !seen.has(c.lure_id) && byId('Lures', c.lure_id)) { seen.add(c.lure_id); order.push(c.lure_id); }
  });
  active('Lures').forEach(l => { if (!seen.has(l.lure_id)) order.push(l.lure_id); });
  if (cf.lure_id && !order.includes(cf.lure_id)) order.unshift(cf.lure_id);
  let list = cf.allLures ? order : order.slice(0, 8);
  if (cf.lure_id && !list.includes(cf.lure_id)) list = [cf.lure_id, ...list];
  return { list: list.map(id => { const l = byId('Lures', id); return { v: id, label: lureName(id), sub: l && l.color }; }), more: order.length > list.length };
}

async function saveCatch(){
  const len = parseFloat(cf.length);
  if (!len) return toast('길이를 입력해 주세요');
  const t = curTrip();
  let id = cf.catch_id;
  if (!id) {
    const base = 'C' + t.trip_id.slice(1) + '-';
    const n = rows('Catches').filter(c => (c.catch_id || '').startsWith(base)).reduce((m, c) => Math.max(m, parseInt(c.catch_id.slice(base.length), 10) || 0), 0);
    id = base + pad(n + 1);
  }
  const lure = byId('Lures', cf.lure_id);
  const row = { catch_id: id, trip_id: t.trip_id, length_cm: String(len), setup_id: cf.setup_id, lure_id: cf.lure_id,
    rig: cf.rig, action: cf.action, structure: cf.structure, depth: cf.depth, weight_g: cf.weight_g,
    color: cf.color || (lure && lure.color) || '', memo: cf.memo, released: cf.released, angler: cf.angler || cfg.me };
  if (!cf.edit) { row.time = hm(); if (pos) { row.lat = pos.lat.toFixed(6); row.lng = pos.lng.toFixed(6); } }
  write('Catches', row);

  if (cf.photo) {
    await idb.put({ photo_id: 'P' + stamp() + Math.random().toString(36).slice(2, 4), trip_id: t.trip_id, catch_id: id,
      taken_at: ymd() + ' ' + hm(), caption: '', is_cover: '', blog_include: '', mime: 'image/jpeg', data: cf.photo });
    await refreshPhotos();
  }
  const edit = cf.edit;
  if (!edit) { last = { ...last, setup_id: cf.setup_id, lure_id: cf.lure_id, rig: cf.rig, action: cf.action, depth: cf.depth }; save(LS.last, last); }
  hideSheet(); render();
  toast(edit ? '수정했어요' : `${len}cm 기록! 🎣`);
}

async function delCatch(){
  if (!confirmTap('delCatch')) return;
  remove('Catches', cf.catch_id);
  try { (await idb.all()).filter(p => p.catch_id === cf.catch_id).forEach(p => idb.del(p.photo_id)); } catch (e) {}
  rows('Photos').filter(p => p.catch_id === cf.catch_id).forEach(p => remove('Photos', p.photo_id));
  await refreshPhotos(); hideSheet(); render(); toast('삭제했어요');
}

/** 실수 방지: 같은 버튼을 3초 안에 두 번 눌러야 실행 */
let confirmKey = '', confirmAt = 0;
function confirmTap(k){
  if (confirmKey === k && Date.now() - confirmAt < 3000) { confirmKey = ''; return true; }
  confirmKey = k; confirmAt = Date.now(); toast('한 번 더 누르면 실행돼요'); return false;
}

/* ───────── 시트 공통 ───────── */
function showSheet(html){ $('#sheet').innerHTML = html; $('#sheetWrap').classList.add('show'); }
function hideSheet(){ $('#sheetWrap').classList.remove('show'); cf = null; ef = null; }
function rerenderSheet(){
  const s = $('#sheet'), top = s.scrollTop;
  s.innerHTML = cf ? vCatch() : ef ? vEnd() : s.innerHTML; s.scrollTop = top;
}

/* ───────── 렌더 ───────── */
function render(){
  const top = window.scrollY;
  $('#app').innerHTML = view === 'settings' ? vSettings() : view === 'start' ? vStart() : view === 'trip' ? vTrip() : vHome();
  if (view === 'start' || view === 'trip') window.scrollTo(0, top);
}

/* ───────── 이벤트 ───────── */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act],[data-f],[data-key]');
  if (!el) { if (e.target.id === 'sheetWrap') hideSheet(); return; }

  // 칩 선택
  if (el.dataset.f) {
    const f = el.dataset.f, k = el.dataset.k, v = el.dataset.v, form = { sf, cf, ef }[f];
    if (el.dataset.multi) form[k] = form[k].includes(v) ? form[k].filter(x => x !== v) : [...form[k], v];
    else form[k] = form[k] === v && k !== 'setup_id' && k !== 'angler' && k !== 'released' ? '' : v;
    if (f === 'cf' && k === 'setup_id') { const st = byId('Setups', v); if (st && st.default_rig) cf.rig = st.default_rig; }
    if (f === 'cf' && k === 'lure_id') { const l = byId('Lures', cf.lure_id); if (l && l.default_rig) cf.rig = l.default_rig; }
    if (f === 'sf' && k === 'spot_id') loadWeather();
    return f === 'sf' ? render() : rerenderSheet();
  }

  // 길이 키패드
  if (el.dataset.key) {
    const k = el.dataset.key; let s = String(cf.length || '');
    if (k === '⌫') s = s.slice(0, -1);
    else if (k === '.') { if (!s.includes('.') && s) s += '.'; }
    else if (s.replace('.', '').length < 4) s = (s === '0' ? '' : s) + k;
    cf.length = s; return rerenderSheet();
  }

  switch (el.dataset.act) {
    case 'settings': view = 'settings'; render(); break;
    case 'home': view = trip ? 'trip' : 'home'; stopGPSIfIdle(); render(); break;
    case 'connect': connect(); break;
    case 'flush': lastErr = ''; queue.forEach(o => { if ((o.tries || 0) >= MAX_TRIES) o.tries = MAX_TRIES - 1; }); flush(); toast('전송 시도'); break;
    case 'retryFailed': queue.forEach(o => { o.tries = 0; }); save(LS.queue, queue); flush(); render(); break;
    case 'dropFailed': if (confirmTap('drop')) { queue = queue.filter(o => (o.tries || 0) < MAX_TRIES); save(LS.queue, queue); render(); } break;
    case 'refresh':
      try { toast('불러오는 중…'); await refresh(); await refreshPhotos(); render(); toast('최신 데이터로 바꿨어요'); }
      catch (err) { toast('불러오기 실패: ' + err.message); }
      break;
    case 'upPhotos': uploadPhotos(); break;
    case 'start': openStart(); break;
    case 'newSpot': sf.newSpot = true; render(); $('#newSpotName').focus(); break;
    case 'addSpot': {
      const name = $('#newSpotName').value.trim(); if (!name) return toast('이름을 입력해 주세요');
      const id = nextId('Spots', 'S', 3);
      write('Spots', { spot_id: id, name, type: '', lat: pos ? pos.lat.toFixed(6) : '', lng: pos ? pos.lng.toFixed(6) : '', share_level: '지역만', active: 'Y' });
      sf.spot_id = id; sf.newSpot = false; render(); loadWeather(); break;
    }
    case 'newComp': sf.newComp = true; render(); $('#newCompName').focus(); break;
    case 'addComp': {
      const n = $('#newCompName').value.trim(); if (n && !sf.companions.includes(n)) sf.companions.push(n);
      sf.newComp = false; render(); break;
    }
    case 'beginTrip': beginTrip(); break;
    case 'catch': openCatch(); break;
    case 'editCatch': openCatch(el.dataset.id); break;
    case 'closeSheet': hideSheet(); break;
    case 'allLures': cf.allLures = true; rerenderSheet(); break;
    case 'newLure': cf.newLure = true; rerenderSheet(); $('#nl_name').focus(); break;
    case 'addLure': {
      const name = $('#nl_name').value.trim(), color = $('#nl_color').value.trim();
      if (!name) return toast('루어 이름을 입력해 주세요');
      const id = nextId('Lures', 'L', 3);
      write('Lures', { lure_id: id, category: '소프트', name, color, active: 'Y' });
      cf.lure_id = id; cf.newLure = false; rerenderSheet(); break;
    }
    case 'moreCatch': cf.more = true; rerenderSheet(); break;
    case 'saveCatch': saveCatch(); break;
    case 'delCatch': delCatch(); break;
    case 'end': openEnd(); break;
    case 'finishTrip': finishTrip(); break;
  }
});
function stopGPSIfIdle(){ if (!trip) stopGPS(); }

// 텍스트 입력은 다시 그리지 않고 값만 반영
document.addEventListener('input', e => {
  const p = e.target.dataset && e.target.dataset.in; if (!p) return;
  const [f, k] = p.split('.'); ({ sf, cf, ef })[f][k] = e.target.value;
});

// 사진 선택
document.addEventListener('change', async e => {
  if (e.target.id !== 'photoIn' || !e.target.files[0]) return;
  try { cf.photo = await resizeImage(e.target.files[0]); rerenderSheet(); }
  catch (err) { toast(err.message); }
});

window.addEventListener('online', () => { updateSync(); flush(); });
window.addEventListener('offline', updateSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });
setInterval(flush, 30000);
setInterval(() => { const el = $('#elapsed'); if (el) el.textContent = elapsed(curTrip()); }, 30000);

/* ───────── 시작 ───────── */
if (trip) startGPS();
render();
refreshPhotos();
flush();
</script>
</body>
</html>
